version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "5001:5001"
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=development
      - PORT=5001
      - CORS_ORIGINS=*
    command: uvicorn api.prediction_api:app --host 0.0.0.0 --port 5001 --reload

  web_app:
    build:
      context: ./web_app
      dockerfile: Dockerfile.web
    ports:
      - "5173:5173"
    volumes:
      - ./web_app:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5001
    depends_on:
      - api

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
