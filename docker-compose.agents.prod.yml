version: '3.8'

# Import development configuration
include:
  - docker-compose.agents.dev.yml

# Override for production with security hardening
services:
  # Meta Agent with security hardening
  meta-agent:
    image: script-ohio/meta-agent:prod
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /var/log:noexec,nosuid,size=50m
    ulimits:
      nproc: 65535
      nofile:
        soft: 20000
        hard: 40000
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: always
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - SECURITY_ENABLED=true
    volumes:
      - .:/app:ro  # Keep read-only mount
      - agent-registry:/app/data/registry
      - logs:/app/logs

  # Apply security to all orchestrator agents
  orchestration-agent:
    image: script-ohio/orchestration-agent:prod
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: always
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info

  analytics-orchestrator:
    image: script-ohio/analytics-orchestrator:prod
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: always
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info

  project-management-agent:
    image: script-ohio/project-management-agent:prod
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: always
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    volumes:
      - .:/app:ro
      - ./project_management:/app/project_management:rw  # Allow write access for project mgmt
      - logs:/app/logs

  documentation-agent:
    image: script-ohio/documentation-agent:prod
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: always
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    volumes:
      - .:/app:ro
      - ./docs:/app/docs:rw  # Allow write access for documentation
      - logs:/app/logs

  # Apply security to specialist agents
  cfbd-integration-agent:
    image: script-ohio/cfbd-integration-agent:prod
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /app/data/tmp:noexec,nosuid,size=200m  # For temporary data processing
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
    restart: always
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    volumes:
      - .:/app:ro
      - data-storage:/app/data  # Write access needed for data storage
      - logs:/app/logs

  model-execution-engine:
    image: script-ohio/model-execution-engine:prod
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=200m
    deploy:
      resources:
        limits:
          cpus: '2.0'  # More CPU for ML operations
          memory: 2G
    restart: always
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    volumes:
      - .:/app:ro
      - model-storage:/app/models:ro  # Models are read-only
      - data-storage:/app/data  # Write access for results
      - logs:/app/logs

  insight-generator-agent:
    image: script-ohio/insight-generator-agent:prod
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    restart: always
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info

  weekly-matchup-analysis:
    image: script-ohio/weekly-matchup-analysis:prod
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    restart: always
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info

  weekly-prediction-generation:
    image: script-ohio/weekly-prediction-generation:prod
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    restart: always
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info

  performance-monitor-agent:
    image: script-ohio/performance-monitor-agent:prod
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: always
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info

  validation-agent:
    image: script-ohio/validation-agent:prod
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
    restart: always
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info

  learning-navigator-agent:
    image: script-ohio/learning-navigator-agent:prod
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: always
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info

  ai-assistant-agent:
    image: script-ohio/ai-assistant-agent:prod
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: always
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info

  weekly-validation-agent:
    image: script-ohio/weekly-validation-agent:prod
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    restart: always
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info

  # Add monitoring stack for production
  prometheus:
    image: prom/prometheus:latest
    container_name: agents-prometheus
    networks:
      - orchestration-network
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /prometheus:w,size=1g  # Allow write for data storage
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: agents-grafana
    networks:
      - orchestration-network
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD_FILE=/run/secrets/grafana_password
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - grafana_password
    restart: always

# Additional volumes for production
volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# Add production secrets
secrets:
  grafana_password:
    file: .secrets/grafana_password.txt