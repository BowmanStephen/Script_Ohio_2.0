version: '3.8'

networks:
  agent-network:
    driver: bridge
    internal: true  # No external access
    ipam:
      config:
        - subnet: 172.20.0.0/16
  cfbd-network:
    driver: bridge
    internal: false  # External API access only
    ipam:
      config:
        - subnet: 172.21.0.0/16
  monitoring-network:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.22.0.0/16

volumes:
  agent-data:
    driver: local
  agent-logs:
    driver: local
  security-audit:
    driver: local

services:
  # Security Orchestrator - Manages zero-trust security
  security-orchestrator:
    build:
      context: .
      dockerfile: containers/Dockerfile.agent
    image: script-ohio/security-orchestrator:latest
    container_name: security-orchestrator
    restart: unless-stopped

    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /var/log:noexec,nosuid,size=50m
    ulimits:
      nproc: 65535
      nofile:
        soft: 20000
        hard: 40000

    environment:
      - AGENT_TYPE=security_orchestrator
      - SECURITY_LEVEL=high
      - LOG_LEVEL=info
      - ENVIRONMENT=production
      - CFBD_API_KEY_FILE=/run/secrets/cfbd_api_key

    secrets:
      - cfbd_api_key
      - jwt_secret
      - db_password

    volumes:
      - agent-data:/app/data
      - agent-logs:/app/logs
      - security-audit:/app/security

    networks:
      - agent-network
      - monitoring-network

    healthcheck:
      test: ["CMD", "python3", "-c", "from agents.security_orchestrator import security_orchestrator; print('Security OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Meta Agent - System governance
  meta-agent:
    build:
      context: .
      dockerfile: containers/Dockerfile.agent
    image: script-ohio/meta-agent:latest
    container_name: meta-agent
    restart: unless-stopped

    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=200m
      - /var/log:noexec,nosuid,size=50m

    environment:
      - AGENT_TYPE=meta
      - SECURITY_LEVEL=high
      - LOG_LEVEL=info
      - ENVIRONMENT=production
      - MAX_AGENTS=20

    volumes:
      - agent-data:/app/data
      - agent-logs:/app/logs
      - security-audit:/app/security

    networks:
      - agent-network
      - monitoring-network

    depends_on:
      security-orchestrator:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python3", "-c", "from agents.meta_agent import meta_agent; print('Meta OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  # Analytics Orchestrator - Domain routing
  analytics-orchestrator:
    build:
      context: .
      dockerfile: containers/Dockerfile.agent
    image: script-ohio/analytics-orchestrator:latest
    container_name: analytics-orchestrator
    restart: unless-stopped

    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=300m
      - /var/log:noexec,nosuid,size=100m

    environment:
      - AGENT_TYPE=analytics_orchestrator
      - SECURITY_LEVEL=medium
      - LOG_LEVEL=info
      - ENVIRONMENT=production
      - CFBD_API_KEY_FILE=/run/secrets/cfbd_api_key

    secrets:
      - cfbd_api_key

    volumes:
      - agent-data:/app/data
      - agent-logs:/app/logs

    networks:
      - agent-network
      - cfbd-network  # For external API access

    depends_on:
      meta-agent:
        condition: service_healthy
      security-orchestrator:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python3", "-c", "from agents.analytics_orchestrator import analytics_orchestrator; print('Analytics OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.5'
          memory: 3G
        reservations:
          cpus: '1.0'
          memory: 1G

  # Memory Manager - Multi-level memory system
  memory-manager:
    build:
      context: .
      dockerfile: containers/Dockerfile.agent
    image: script-ohio/memory-manager:latest
    container_name: memory-manager
    restart: unless-stopped

    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=500m
      - /memory_cache:size=1G,mode=1777

    environment:
      - AGENT_TYPE=memory_manager
      - SECURITY_LEVEL=high
      - LOG_LEVEL=info
      - ENVIRONMENT=production
      - MEMORY_CACHE_DIR=/memory_cache
      - MAX_WORKING_MEMORY=512M
      - MAX_EPISODIC_MEMORY=1G

    volumes:
      - agent-data:/app/data
      - agent-logs:/app/logs

    networks:
      - agent-network
      - monitoring-network

    depends_on:
      meta-agent:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python3", "-c", "from agents.memory_manager import memory_manager; print('Memory OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Monitoring & Alerting
  monitoring-agent:
    build:
      context: .
      dockerfile: containers/Dockerfile.agent
    image: script-ohio/monitoring-agent:latest
    container_name: monitoring-agent
    restart: unless-stopped

    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # For metrics endpoint
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /var/log:noexec,nosuid,size=50m

    environment:
      - AGENT_TYPE=monitoring
      - SECURITY_LEVEL=medium
      - LOG_LEVEL=info
      - ENVIRONMENT=production
      - METRICS_PORT=9090

    volumes:
      - agent-logs:/app/logs
      - security-audit:/app/security

    networks:
      - monitoring-network

    depends_on:
      meta-agent:
        condition: service_healthy
      security-orchestrator:
        condition: service_healthy

    ports:
      - "9090:9090"  # Metrics endpoint

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

# Secrets management
secrets:
  cfbd_api_key:
    file: ./secrets/cfbd_api_key.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  db_password:
    file: ./secrets/db_password.txt